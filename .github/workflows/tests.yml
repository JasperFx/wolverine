name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  config: Release
  disable_test_parallelization: true

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    # The 20 minute cap is deliberately a REAL signal: a job that needs longer than this is a job that
    # needs to be split, not a job that needs a bigger number. The two suites that used to blow through it
    # (CIAWS and CIPolecat) are now sharded across parallel jobs instead. See #3350.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - CIPolecat
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run Tests
        run: ./build.sh ${{ matrix.target }} --framework net9.0

      - name: Stop containers
        if: always()
        run: docker compose down
