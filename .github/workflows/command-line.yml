name: command-line

# Smoke tests for the Wolverine command-line surface.
#
# describe-handlers-smoke: builds the Quickstart sample (which opts into
# RunJasperFxCommands) and exercises the `wolverine-diagnostics describe-handlers`
# command end to end: it must discover a known handler and emit the expected
# DescribeHandlerMatch report, and it must exit non-zero for an unknown type. No
# database or message broker is required — the command builds the host and compiles
# the handler graph without starting it.
#
# codegen-drift: regenerates the committed `codegen write` output and fails if any
# of it moved (GH-4421). See the CICodegenDrift target in build/CITargets.cs for
# what it covers and what it deliberately does not.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  config: Release

jobs:
  describe-handlers-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: wolverine-diagnostics describe-handlers smoke test
        run: |
          set -euo pipefail

          echo "::group::Positive case — known handler is discovered"
          output=$(dotnet run --project src/Samples/Quickstart --framework net9.0 -- \
            wolverine-diagnostics describe-handlers CreateIssueHandler)
          echo "$output"
          echo "$output" | grep -q "Handler discovery report: Quickstart.CreateIssueHandler"
          echo "$output" | grep -q "Successfully found Quickstart.CreateIssueHandler during scanning."
          echo "$output" | grep -q "HIT -- Method name is 'Handle'"
          echo "::endgroup::"

          echo "::group::Fuzzy case — a partial name matches multiple types"
          fuzzy=$(dotnet run --project src/Samples/Quickstart --framework net9.0 -- \
            wolverine-diagnostics describe-handlers Create)
          echo "$fuzzy"
          count=$(echo "$fuzzy" | grep -c "Handler discovery report:")
          echo "matched report count = $count"
          test "$count" -ge 2
          echo "::endgroup::"

          echo "::group::Negative case — unknown type exits non-zero"
          if dotnet run --project src/Samples/Quickstart --framework net9.0 -- \
               wolverine-diagnostics describe-handlers ZzzNoSuchHandler > /dev/null 2>&1; then
            echo "Expected describe-handlers to exit non-zero for an unknown type"
            exit 1
          fi
          echo "::endgroup::"

          echo "describe-handlers smoke test passed"

      - name: event-model export smoke test
        run: |
          set -euo pipefail

          echo "::group::event-model writes the merged Event Model as JSON without starting the host"
          # dotnet run --project runs in the sample's directory, so name the output absolutely
          out="$GITHUB_WORKSPACE/artifacts/quickstart-event-model.json"
          dotnet run --project src/Samples/Quickstart --framework net9.0 -- \
            event-model --json "$out"
          test -s "$out"
          head -c 2000 "$out"; echo
          grep -q '"name": "Quickstart"' "$out"
          grep -q '"slices"' "$out"
          grep -q '"name": "CreateIssue"' "$out"
          grep -q '"triggerKind": "MessageHandler"' "$out"
          grep -q '"handlerType"' "$out"
          # GH-4387: a message handler no longer guesses "Command" -- it cannot tell a Command slice
          # from an Automation slice. The MODEL can, though: IssueCreated only ever arrives because
          # CreateIssueHandler cascaded it, which is an Automation.
          grep -q '"pattern": "Automation"' "$out"
          grep -q '"elements"' "$out"
          echo "::endgroup::"

          echo "event-model smoke test passed"

  # GH-4486. Separate job from codegen-drift on purpose: both rewrite the generated tree, and this one
  # depends on building AFTER the wipe (see the note on CICodegenTest) while the drift gate builds
  # before it. Keeping them apart means neither has to reason about the other's leftovers.
  codegen-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Runs `codegen test` against a handler-bearing project with no pre-generated code -- the path
      # that broke in 6.37.0 and that neither the drift gate (`codegen write`) nor AotSmoke (`publish`)
      # exercises. The target starts its own rabbitmq container.
      - name: Codegen test gate
        run: ./build.sh CICodegenTest --framework net9.0

      - name: Stop containers
        if: always()
        run: docker compose down

  codegen-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # GH-4421. Regenerates the committed `codegen write` output and fails on any diff. This is only
      # a believable gate as of JasperFx 2.69.2, which made the emitted statement order deterministic
      # (jasperfx#832); before that, a byte comparison could not tell real drift from per-process
      # hash-order noise. The target starts its own postgresql + rabbitmq containers.
      - name: Codegen drift gate
        run: ./build.sh CICodegenDrift --framework net9.0

      # The target throws with the file list; this prints the content of the drift so a reviewer can
      # see WHAT moved without having to reproduce the run locally.
      - name: Show the drift
        if: failure()
        run: |
          git status --porcelain
          git --no-pager diff

      - name: Stop containers
        if: always()
        run: docker compose down
