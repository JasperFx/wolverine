name: Publish Wolverine Nugets

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # NuGet trusted publishing (same as main and 6.0): NuGet/login trades this run's GitHub OIDC token for a
    # short-lived API key under the trusted publishing policy on nuget.org that names this repository and
    # THIS workflow file. The old NUGET_API_KEY secret expired, so 5.41.1's first publish pushed nothing.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
          
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run Pack
        run: ./build.sh pack
        shell: bash

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: jeremydmiller

      - name: Publish to NuGet
        # xargs exits non-zero when any push fails, so a refused push fails the run instead of passing silently
        run: |
          find . -name '*.nupkg' -print0 | xargs -0 -I{} dotnet nuget push "{}" -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        shell: bash
